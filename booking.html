<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATAYA STUDIO | Booking</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#241B20">
<link rel="apple-touch-icon" href="./ataya-icon-512.png">
<style>
:root{--rose:#b85f79;--deep:#74394d;--line:#eed8de}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(140deg,#fff5f6,#f9e4e9);font-family:Tahoma,'Noto Sans Thai',sans-serif;color:#553d45}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:480px;margin:auto;min-height:100dvh;background:#fffafb;box-shadow:0 0 40px #b85f7925;padding-bottom:85px}
.hero{background:linear-gradient(130deg,#f9d9e1,#fff6f6);padding:35px 22px 26px;text-align:center}
.brand{font:42px Georgia,serif;letter-spacing:4px;color:var(--deep)}
.sub{font:12px Georgia,serif;letter-spacing:2px}.tag{font-size:13px;margin-top:13px}
.content{padding:20px}.heading{font-size:20px;font-weight:bold;color:var(--deep);margin:8px 0 15px}
.muted{font-size:13px;color:#947e85}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 5px 16px #b85f790d}
.service{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:bold;color:var(--rose)}
.btn{background:var(--rose);color:white;border:0;border-radius:12px;padding:13px 18px;width:100%;margin-top:12px}
.btn:disabled{opacity:.5}.outline{background:white;border:1px solid var(--rose);color:var(--rose)}
.small{width:auto;padding:8px 12px;margin:0}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px}
.tabs button{background:none;border:0;color:#806a72;font-size:12px}.tabs button.active{color:var(--rose);font-weight:bold}
.field{display:block;margin:14px 0;font-size:14px}.field input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:12px;background:white}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{border:1px solid var(--line);background:white;padding:12px 5px;border-radius:10px}
.slot.selected{background:var(--rose);color:white}.slot:disabled{opacity:.4}
.pill{display:inline-block;background:#fce4eb;color:var(--deep);padding:6px 10px;border-radius:20px;font-size:12px}
.status{display:flex;gap:6px;flex-wrap:wrap}.status button{border:1px solid var(--line);background:#fff;padding:6px;border-radius:8px;font-size:12px}
.status button.active{background:var(--rose);color:white}.center{text-align:center}
.big{font:25px Georgia,serif;color:var(--deep);overflow-wrap:anywhere}.empty{padding:35px;text-align:center;color:#9b8a90}
.adminstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.adminstat .card{text-align:center;margin:0}.adminstat strong{font-size:26px;color:var(--deep)}
</style>
</head>
<body>
<div id="root" class="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://ufhkfwtdxfbfydnyoifn.supabase.co';
const SUPABASE_KEY='sb_publishable_3Dn2_I08tOMAqUX1NvjKLw_HBCgqSID';
const API=SUPABASE_URL+'/functions/v1/booking-api';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const services=[
{name:'แต่งหน้าคลุมผม',desc:'ลุคสวยละมุน เหมาะกับทุกโอกาส',price:1590},
{name:'แต่งหน้าเจ้าสาว',desc:'งานแต่ง งานพิธี และวันสำคัญ',price:2590},
{name:'แต่งหน้าพรีเวดดิ้ง',desc:'พร้อมสำหรับการถ่ายภาพ',price:3590},
{name:'แต่งหน้าออกงาน',desc:'สวยมั่นใจในวันพิเศษ',price:1290},
{name:'จัดแต่งผ้าคลุม',desc:'จัดทรงผ้าคลุมอย่างประณีต',price:790},
{name:'ทดลองแต่งหน้า',desc:'ทดลองลุคก่อนวันจริง',price:990}
];
const packages=[
{name:'Basic',extra:0,desc:'แต่งหน้าคลุมผม'},
{name:'Premium',extra:1000,desc:'แต่งหน้าคลุมผม + ทำผม'},
{name:'Luxury',extra:2000,desc:'แต่งหน้าคลุมผม + ทำผม + ดูแลลุค'}
];
const times=['08:30','09:30','10:30','11:30','12:30','13:30','14:30','15:30','16:30'];
const statuses=[['pending','รอยืนยัน'],['รอยืนยัน','รอยืนยัน'],['confirmed','ยืนยันแล้ว'],['ยืนยันแล้ว','ยืนยันแล้ว'],['in_progress','กำลังให้บริการ'],['completed','เสร็จสิ้น'],['cancelled','ยกเลิก'],['ยกเลิก','ยกเลิก']];
const paymentLabels={awaiting_slip:'รอแนบสลิป',under_review:'รอตรวจสอบมัดจำ',verified:'ตรวจสอบมัดจำแล้ว',rejected:'สลิปไม่ผ่าน',};
let qrUrl='./promptpay-qr.jpg';
const isAdmin=sessionStorage.getItem('ataya_admin_demo')==='yes';
let adminPin='',bookings=[],page=isAdmin?'admin':'home';
let selected=0,pkg=0,date='',time='',name='',phone='',last=null,loading=false;
let profileLoaded=false,profilePromise=null,profileMessage='';
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('th-TH')+' ฿';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const label=s=>statuses.find(x=>x[0]===s)?.[1]||s;
function normalize(b){return {...b,date:b.booking_date,time:String(b.booking_time||'').slice(0,5),name:b.customer_name,package:b.package_name,price:Number(b.price||0),deposit_amount:b.deposit_amount==null?null:Number(b.deposit_amount),balance_amount:b.balance_amount==null?null:Number(b.balance_amount)}}
const paymentInfo=b=>b.payment_status?`<div class="muted">มัดจำ 30% ${money(b.deposit_amount)} · คงเหลือ ${money(b.balance_amount)}<div>สถานะชำระเงิน: ${esc(paymentLabels[b.payment_status]||b.payment_status)}</div></div>`:'<div class="muted">รายการจองเดิม (ก่อนเปิดระบบมัดจำ)</div>';
async function loadQR(){qrUrl='./promptpay-qr.jpg';render()}

// อ่านข้อมูลของสมาชิกที่ล็อกอินอยู่เท่านั้น; RLS profiles_select_own จำกัดตาม auth.uid() = id
async function loadProfile(){
if(isAdmin||!db)return;
if(profilePromise)return profilePromise;
profilePromise=(async()=>{
try{
const {data:sessionData,error:sessionError}=await db.auth.getSession();
if(sessionError)throw sessionError;
const user=sessionData?.session?.user;
if(!user){profileMessage='กรุณาเข้าสู่ระบบลูกค้า';return}
const {data:profile,error}=await db.from('profiles').select('full_name,phone').eq('id',user.id).maybeSingle();
if(error)throw error;
// สำรองข้อมูลจาก metadata ที่เคยบันทึกตอนสมัคร ในกรณีไม่มีแถว profiles
const meta=user.user_metadata||{};
if(!name)name=String(profile?.full_name||meta.full_name||meta.name||'').trim();
if(!phone)phone=String(profile?.phone||meta.phone||'').trim();
if(!profile?.full_name&&!profile?.phone)profileMessage='ไม่พบข้อมูลโปรไฟล์ครบถ้วน กรุณากรอกชื่อและเบอร์โทรก่อนจอง';
else profileMessage='ดึงข้อมูลสมาชิกให้แล้ว สามารถแก้ไขเฉพาะการจองนี้ได้';
}catch(e){console.error('Profile loading failed:',e);profileMessage='โหลดข้อมูลสมาชิกไม่สำเร็จ กรุณากรอกชื่อและเบอร์โทรด้วยตนเอง';}
finally{profileLoaded=true;if(page==='confirm')render()}
})();
return profilePromise;
}

async function callAPI(action,payload={},admin=false){
const headers={'Content-Type':'application/json','apikey':SUPABASE_KEY};
if(!admin){
if(!db)throw Error('โหลดระบบสมาชิกไม่สำเร็จ');
const {data,error}=await db.auth.getSession();
if(error||!data.session)throw Error('กรุณาเข้าสู่ระบบลูกค้าก่อน');
headers.Authorization='Bearer '+data.session.access_token;
}
const res=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,...payload,...(admin?{pin:adminPin}:{})})});
let out;try{out=await res.json()}catch{throw Error('เซิร์ฟเวอร์ไม่ตอบกลับ')}
if(!res.ok)throw Error(out.error||'เกิดข้อผิดพลาด '+res.status);
return out;
}
async function refresh(){
if(isAdmin&&!adminPin)return;
try{loading=true;render();const out=await callAPI(isAdmin?'admin_list':'my_bookings',{},isAdmin);bookings=(out.bookings||[]).map(normalize)}
catch(e){alert('โหลดรายการไม่สำเร็จ: '+e.message);if(isAdmin&&/รหัสแอดมิน/.test(e.message))adminPin=''}
finally{loading=false;render()}
}
function nav(p){
if(p==='admin'&&!isAdmin)return;
page=p;render();window.scrollTo(0,0);
if(p==='confirm'&&!isAdmin&&!profileLoaded)loadProfile();
if(p==='admin'||p==='bookings'||p==='schedule')refresh();
}
function logoutAdmin(){adminPin='';sessionStorage.removeItem('ataya_admin_demo');location.replace('./index.html')}
async function logoutCustomer(){
if(!confirm('ต้องการออกจากระบบใช่ไหม?'))return;
try{if(!db)throw Error('ไม่สามารถเชื่อมต่อระบบสมาชิกได้');const {error}=await db.auth.signOut();if(error)throw error;bookings=[];sessionStorage.removeItem('ataya_admin_demo');location.replace('./index.html')}
catch(e){alert('ออกจากระบบไม่สำเร็จ: '+e.message)}
}
function head(){return `<div class="hero"><div style="font-size:24px">♕ ♡</div><div class="brand">ATAYA STUDIO</div><div class="sub">BRIDAL & HIJAB BEAUTY</div><div class="tag">สวยสง่าในวันสำคัญ ในแบบที่เป็นคุณ ♡</div></div>`}
function foot(){const items=isAdmin?[['admin','⚙','แดชบอร์ด'],['home','⌂','บริการ'],['bookings','▦','การจอง']]:[['home','⌂','หน้าหลัก'],['bookings','▦','การจอง']];return `<div class="tabs">${items.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="nav('${p}')"><div style="font-size:23px">${i}</div>${t}</button>`).join('')}</div>`}
function render(){
let h=head();
if(page==='home'){
h+=`<main class="content"><div class="heading">บริการของเรา ♡</div><div class="muted">เลือกบริการที่เหมาะกับวันพิเศษของคุณ</div>${services.map((s,i)=>`<div class="card service"><div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.desc)}</div><div class="price">เริ่มต้น ${money(s.price)}</div></div><button class="btn small" onclick="selected=${i};nav('detail')">ดูบริการ</button></div>`).join('')}</main>`;
}else if(page==='detail'){
let s=services[selected];
h+=`<main class="content"><button class="btn outline small" onclick="nav('home')">← กลับ</button><div class="heading" style="margin-top:20px">${esc(s.name)}</div><div class="card center" style="background:linear-gradient(140deg,#f7d6df,#fff)"><div style="font-size:70px">♕</div><div>${esc(s.desc)}</div></div><div class="heading">เริ่มต้น ${money(s.price)}</div><p>เลือกแพ็กเกจและช่วงเวลาที่สะดวกได้ด้วยตนเอง</p><button class="btn" onclick="nav('schedule')">เลือกแพ็กเกจและวันเวลา →</button></main>`;
}else if(page==='schedule'){
h+=`<main class="content"><div class="heading">เลือกแพ็กเกจและจองวันเวลา</div><div class="muted">${esc(services[selected].name)}</div>
${packages.map((p,i)=>`<div class="card service" onclick="pkg=${i};render()" style="border-color:${pkg===i?'#b85f79':''};cursor:pointer"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.desc)}</div><div class="price">${money(services[selected].price+p.extra)}</div></div><span>${pkg===i?'🔘':'◯'}</span></div>`).join('')}
<label class="field">เลือกวันที่<input type="date" min="${today()}" value="${esc(date)}" onchange="date=this.value;time='';render()"></label>
<div class="heading">เลือกเวลา</div><div class="slots">${times.map(t=>{let full=date&&bookings.some(b=>b.date===date&&b.time===t&&!['cancelled','ยกเลิก'].includes(b.status));return `<button class="slot ${time===t?'selected':''}" ${full?'disabled':''} onclick="time='${t}';render()">${t}${full?'<div>เต็มแล้ว</div>':''}</button>`}).join('')}</div>
<button class="btn" onclick="if(!date||!time){alert('กรุณาเลือกวันและเวลา');return}nav('confirm')">ดำเนินการต่อ →</button><p class="muted">เวลาที่ว่างอาจเปลี่ยนแปลงได้ ระบบจะตรวจสอบอีกครั้งเมื่อยืนยัน</p></main>`;
}else if(page==='confirm'){
h+=`<main class="content"><div class="heading">ยืนยันการจอง</div><div class="card"><strong>${esc(services[selected].name)} · ${esc(packages[pkg].name)}</strong><p>วันที่ ${esc(date)} เวลา ${esc(time)} น.</p><div class="price">ยอดรวม ${money(services[selected].price+packages[pkg].extra)}</div><p>มัดจำ 30%: <strong>${money(Math.round((services[selected].price+packages[pkg].extra)*30)/100)}</strong></p><p>ชำระส่วนที่เหลือ: ${money((services[selected].price+packages[pkg].extra)-Math.round((services[selected].price+packages[pkg].extra)*30)/100)}</p><div class="muted">หลังบันทึกการจอง กรุณาโอนมัดจำและแนบสลิปเพื่อให้ร้านตรวจสอบ</div></div>
${!isAdmin?`<p class="muted">${esc(profileLoaded?profileMessage:'กำลังดึงข้อมูลสมาชิก...')}</p>`:''}
<label class="field">ชื่อผู้จอง<input id="customer" autocomplete="name" value="${esc(name)}" placeholder="ชื่อ-นามสกุล" oninput="name=this.value"></label>
<label class="field">เบอร์โทรศัพท์<input id="phone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(phone)}" placeholder="08xxxxxxxx" oninput="phone=this.value"></label>
<button class="btn" id="submitBtn" onclick="submitBooking()">ยืนยันการจอง ♡</button></main>`;
}else if(page==='success'){
h+=`<main class="content center"><div style="font-size:70px;color:var(--rose)">✓</div><div class="heading">ส่งคำขอจองสำเร็จ!</div><p>กรุณาชำระมัดจำและแนบสลิปก่อนร้านยืนยันคิว ♡</p><div class="card"><div class="muted">หมายเลขการจอง</div><div class="big">${esc(last?.id||'')}</div><p>${esc(last?.date||'')} · ${esc(last?.time||'')} น.</p><span class="pill">รอตรวจสอบมัดจำ</span></div>${last?paymentPanel(last):''}<button class="btn" onclick="nav('bookings')">ดูรายการจอง</button><button class="btn outline" onclick="nav('home')">กลับหน้าหลัก</button></main>`;
}else if(page==='bookings'){
h+=`<main class="content"><div class="heading">${isAdmin?'รายการจองทั้งหมด':'ประวัติการจองของฉัน'}</div><button class="btn outline" onclick="refresh()">↻ โหลดข้อมูลล่าสุด</button>${loading?'<div class="empty">กำลังโหลด...</div>':bookings.length?bookings.map(b=>`<div class="card"><div class="service"><strong>${esc(String(b.id).slice(0,8))}</strong><span class="pill">${esc(label(b.status))}</span></div><p>${esc(b.service)} · ${esc(b.package)}</p><div class="muted">${esc(b.date)} · ${esc(b.time)} น.</div><p>${esc(b.name)} · ${esc(b.phone)}</p><div class="price">${money(b.price)}</div>${paymentInfo(b)}${!isAdmin?paymentPanel(b):''}</div>`).join(''):'<div class="empty">ยังไม่มีรายการจอง</div>'}${!isAdmin?'<button class="btn outline" onclick="logoutCustomer()">🔒 ออกจากระบบลูกค้า</button>':''}</main>`;
}else if(page==='admin'){
if(!isAdmin){page='home';render();return}
if(!adminPin){h+=`<main class="content"><div class="heading">🔒 ยืนยันสิทธิ์แอดมิน</div><label class="field">รหัสแอดมิน<input type="password" id="adminSecret" autocomplete="off"></label><button class="btn" onclick="loginAdmin()">เข้าสู่ Dashboard</button><button class="btn outline" onclick="logoutAdmin()">กลับหน้าแรก</button></main>`}
else{
const active=bookings.filter(b=>!['cancelled','ยกเลิก'].includes(b.status));
h+=`<main class="content"><div class="heading">⚙ แดชบอร์ดแอดมิน</div><button class="btn outline" onclick="refresh()">↻ โหลดข้อมูลล่าสุด</button><div class="adminstat"><div class="card"><div class="muted">การจองทั้งหมด</div><strong>${bookings.length}</strong></div><div class="card"><div class="muted">คิวรอยืนยัน</div><strong>${bookings.filter(b=>['pending','รอยืนยัน'].includes(b.status)).length}</strong></div><div class="card"><div class="muted">คิววันนี้</div><strong>${active.filter(b=>b.date===today()).length}</strong></div><div class="card"><div class="muted">ยอดบริการเสร็จสิ้น</div><strong style="font-size:18px">${money(bookings.filter(b=>['completed','เสร็จสิ้น'].includes(b.status)).reduce((a,b)=>a+b.price,0))}</strong></div></div><div class="heading" style="margin-top:25px">จัดการคิว</div>
${loading?'<div class="empty">กำลังโหลด...</div>':bookings.length?bookings.map(b=>`<div class="card"><div class="service"><strong>${esc(String(b.id).slice(0,8))}</strong><span class="pill">${esc(label(b.status))}</span></div><p>${esc(b.name)} · ${esc(b.phone)}</p><div>${esc(b.service)} / ${esc(b.package)}</div><p class="muted">${esc(b.date)} เวลา ${esc(b.time)} น.</p><div class="price">${money(b.price)}</div>${paymentInfo(b)}${b.slip_path?`<button class="btn outline small" onclick="openSlip('${esc(b.id)}')">ดูสลิป</button>`:''}${b.payment_status==='under_review'?`<div class="status"><button onclick="reviewPayment('${esc(b.id)}','verified')">✓ ตรวจสอบยอดเงินแล้ว</button><button onclick="reviewPayment('${esc(b.id)}','rejected')">✕ ไม่ผ่าน</button></div>`:''}<p class="muted">เปลี่ยนสถานะ</p><div class="status">${statuses.filter(x=>['รอยืนยัน','ยืนยันแล้ว','ยกเลิก'].includes(x[0])).map(([st,t])=>`<button ${st==='ยืนยันแล้ว'&&b.payment_status!=null&&b.payment_status!=='verified'?'disabled title="ต้องตรวจสอบมัดจำก่อน"':''} class="${b.status===st?'active':''}" onclick="updateStatus('${esc(b.id)}','${st}')">${t}</button>`).join('')}</div></div>`).join(''):'<div class="empty">ยังไม่มีคิวจอง</div>'}<button class="btn outline" onclick="logoutAdmin()">🔒 ออกจากระบบแอดมิน</button></main>`;
}
}
root.innerHTML=h+foot();
}
function paymentPanel(b){
if(!b.payment_status||!['awaiting_slip','rejected'].includes(b.payment_status))return '';
return `<div class="card"><strong>ชำระมัดจำ 30% · ${money(b.deposit_amount)}</strong><p class="muted">กรุณาสแกน QR พร้อมเพย์ของร้าน แล้วแนบสลิป (JPG/PNG/WebP ไม่เกิน 5 MB)</p>${qrUrl?`<img src="${esc(qrUrl)}" alt="QR พร้อมเพย์ร้าน" style="display:block;width:220px;max-width:100%;margin:auto" referrerpolicy="no-referrer">`:'<p class="muted">ร้านยังไม่ได้ตั้งค่า QR พร้อมเพย์ กรุณาติดต่อร้านก่อนโอน</p>'}<input id="slip-${esc(b.id)}" type="file" accept="image/png,image/jpeg,image/webp" aria-label="เลือกภาพสลิป"><button class="btn" onclick="uploadSlip('${esc(b.id)}')">ส่งสลิปให้ร้านตรวจสอบ</button></div>`;
}
async function uploadSlip(id){
const input=document.getElementById('slip-'+id),file=input?.files?.[0];
if(!file)return alert('กรุณาเลือกภาพสลิป');
if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5242880)return alert('รองรับ JPG PNG WebP ไม่เกิน 5 MB');
const reader=new FileReader();
reader.onload=async()=>{try{const image_base64=String(reader.result).split(',')[1];await callAPI('upload_slip',{id,mime:file.type,image_base64});alert('ส่งสลิปแล้ว รอร้านตรวจสอบยอดเงินจริง');if(page==='success'){last={...last,payment_status:'under_review'};render()}else await refresh()}catch(e){alert(e.message)}};
reader.readAsDataURL(file);
}
async function openSlip(id){try{const out=await callAPI('admin_slip_url',{id},true);window.open(out.url,'_blank','noopener,noreferrer')}catch(e){alert(e.message)}}
async function reviewPayment(id,decision){
const msg=decision==='verified'?'ยืนยันว่าตรวจสอบยอดเงินเข้าบัญชีจริงแล้ว?':'ปฏิเสธสลิปนี้?';
if(!confirm(msg))return;
const note=decision==='rejected'?prompt('เหตุผลที่สลิปไม่ผ่าน (ไม่บังคับ)')||'':'';
try{await callAPI('admin_review_payment',{id,decision,note},true);await refresh()}catch(e){alert(e.message)}
}
async function loginAdmin(){
const pin=document.getElementById('adminSecret')?.value||'';
if(!pin)return alert('กรุณาใส่รหัสแอดมิน');
adminPin=pin;
try{const out=await callAPI('admin_list',{},true);bookings=(out.bookings||[]).map(normalize);render()}
catch(e){adminPin='';alert(e.message)}
}
async function submitBooking(){
name=document.getElementById('customer').value.trim();phone=document.getElementById('phone').value.trim();
if(!name||!/^0\d{8,9}$/.test(phone))return alert('กรุณากรอกชื่อและเบอร์โทรศัพท์ให้ถูกต้อง');
const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='กำลังบันทึกการจอง...';
try{
const out=await callAPI('create_booking',{customer_name:name,phone,service:services[selected].name,package_name:packages[pkg].name,booking_date:date,booking_time:time,price:services[selected].price+packages[pkg].extra});
last=normalize(out.booking);bookings.unshift(last);nav('success');
}catch(e){alert('จองไม่สำเร็จ: '+e.message);btn.disabled=false;btn.textContent='ยืนยันการจอง ♡'}
}
async function updateStatus(id,status){
if(!isAdmin||!adminPin)return alert('กรุณาเข้าสู่ระบบแอดมิน');
try{await callAPI('admin_update',{id,status},true);await refresh()}
catch(e){alert('เปลี่ยนสถานะไม่สำเร็จ: '+e.message)}
}
render();
if(!isAdmin){loadProfile();refresh();loadQR()}
</script>
