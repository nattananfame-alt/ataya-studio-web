
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ATAYA STUDIO</title>

  <meta name="theme-color" content="#74394d">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon"
        href="./ataya-icon-512.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        135deg,
        #fff1f4,
        #f4d6df
      );
      font-family: Tahoma, sans-serif;
      color: #74394d;
      text-align: center;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 12px 35px #74394d20;
    }

    h1 {
      font-family: Georgia, serif;
      letter-spacing: 3px;
      font-size: 30px;
    }

    p {
      font-size: 14px;
      line-height: 1.8;
    }

    a {
      display: block;
      padding: 14px;
      margin-top: 20px;
      background: #b85f79;
      color: white;
      text-decoration: none;
      border-radius: 12px;
    }
  </style>

  <script>
    window.location.replace("./login.html");
  </script>
</head>

<body>
  <div class="card">
    <h1>ATAYA STUDIO</h1>

    <p>กำลังเปิดระบบสมาชิก...</p>

    <a href="./login.html">
